name = "tracethebreak-photos"
main = "index.js"
compatibility_date = "2024-09-23"

[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "report-photos"

# Per-user upload throttle (see the /upload handler in index.js). Keyed on
# the caller's Supabase uid, not IP, since every /upload caller is already
# authenticated. "namespace_id" just needs to be an integer that's unique
# within this Cloudflare account across all your rate limiters — 1001 is
# fine as long as you don't reuse it for a different limiter later.
# Note: period can only be 10 or 60 (seconds), and the limit is enforced
# per Cloudflare location and is eventually-consistent, not a hard global
# cap — good enough to blunt abuse/runaway costs, not a precise quota.
[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 20
period = 60

[vars]
SUPABASE_URL = "https://fnkqmwweljsupbmerbkh.supabase.co"