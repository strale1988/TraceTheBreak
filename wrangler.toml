name = "tracethebreak-photos"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Binds the Worker directly to your R2 bucket — no access keys needed,
# the binding itself is the credential, and it's what makes reads/writes free
# (Workers-to-R2 traffic never touches the public internet or incurs egress).
[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "report-photos"

# Secrets (do NOT put these here — set them with `wrangler secret put <NAME>`):
#   SUPABASE_JWT_SECRET        Supabase Dashboard -> Project Settings -> API -> JWT Secret
#   SIGNING_SECRET             any random 32+ byte string, e.g. `openssl rand -hex 32`
#   SUPABASE_URL                (optional, only needed for admin-delete) your project URL
#   SUPABASE_SERVICE_ROLE_KEY   (optional, only needed for admin-delete) service_role key
